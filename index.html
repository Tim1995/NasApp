<script>
  if (location.protocol === 'file:') {
    console.warn('[小脚丫] 当前以 file:// 方式打开。部分浏览器在此模式下会限制本地存储，建议运行 start.bat 通过本地服务器访问。');
  }
  window.addEventListener('error', function (e) {
    var t = document.getElementById('toast-host');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast-host';
      t.className = 'toast-host';
      document.body.appendChild(t);
    }
    var n = document.createElement('div');
    n.className = 'toast toast--error is-in';
    n.textContent = '出错了：' + (e.message || '未知错误');
    t.appendChild(n);
  });
  BF.App.start();
</script>
